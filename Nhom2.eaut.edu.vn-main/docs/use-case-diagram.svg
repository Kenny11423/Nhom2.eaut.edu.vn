<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .frame { fill: #ffffff; stroke: #6f86a3; stroke-width: 2.5; rx: 22; ry: 22; }
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #19324a; }
      .subtitle { font: 15px "Segoe UI", Arial, sans-serif; fill: #61758c; }
      .system-title { font: 700 24px "Segoe UI", Arial, sans-serif; fill: #19324a; }
      .actor-line { stroke: #19324a; stroke-width: 2.4; fill: none; }
      .actor-head { fill: #ffffff; stroke: #19324a; stroke-width: 2.4; }
      .actor-text { font: 700 19px "Segoe UI", Arial, sans-serif; fill: #19324a; text-anchor: middle; }
      .uc { fill: #f2f6fb; stroke: #7f97b6; stroke-width: 2; }
      .uc-text { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #243f5a; text-anchor: middle; }
      .assoc { stroke: #637b98; stroke-width: 2.1; fill: none; }
      .include { stroke: #6a7c93; stroke-width: 1.8; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
      .extend { stroke: #9a6a3c; stroke-width: 1.8; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow2); }
      .label { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #5d7188; }
      .group { font: 700 15px "Segoe UI", Arial, sans-serif; fill: #69809b; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a7c93"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a6a3c"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="900"/>
  <text class="title" x="48" y="54">Sơ đồ Use Case - Hệ thống quản lý bán vé tàu</text>
  <text class="subtitle" x="48" y="82">Bố cục cân đối, phân nhóm rõ ràng và hạn chế giao cắt đường nối.</text>

  <rect class="frame" x="180" y="110" width="840" height="740"/>
  <text class="system-title" x="600" y="150" text-anchor="middle">Hệ thống quản lý bán vé tàu</text>

  <!-- Actors -->
  <g transform="translate(80,350)">
    <circle class="actor-head" cx="0" cy="-48" r="22"/>
    <line class="actor-line" x1="0" y1="-26" x2="0" y2="52"/>
    <line class="actor-line" x1="-36" y1="0" x2="36" y2="0"/>
    <line class="actor-line" x1="0" y1="52" x2="-28" y2="104"/>
    <line class="actor-line" x1="0" y1="52" x2="28" y2="104"/>
    <text class="actor-text" x="0" y="145">Nhân viên bán vé</text>
  </g>

  <g transform="translate(1120,350)">
    <circle class="actor-head" cx="0" cy="-48" r="22"/>
    <line class="actor-line" x1="0" y1="-26" x2="0" y2="52"/>
    <line class="actor-line" x1="-36" y1="0" x2="36" y2="0"/>
    <line class="actor-line" x1="0" y1="52" x2="-28" y2="104"/>
    <line class="actor-line" x1="0" y1="52" x2="28" y2="104"/>
    <text class="actor-text" x="0" y="145">Quản trị viên</text>
  </g>

  <!-- Group Labels -->
  <text class="group" x="350" y="190">NHÓM BÁN VÉ</text>
  <text class="group" x="850" y="190">NHÓM QUẢN TRỊ</text>
  <text class="group" x="600" y="580">NGHIỆP VỤ HỖ TRỢ</text>

  <!-- Ticket Seller Use Cases -->
  <ellipse class="uc" cx="350" cy="230" rx="120" ry="32"/>
  <text class="uc-text" x="350" y="236">Đăng nhập</text>

  <ellipse class="uc" cx="350" cy="300" rx="120" ry="32"/>
  <text class="uc-text" x="350" y="306">Đăng xuất</text>

  <ellipse class="uc" cx="350" cy="370" rx="120" ry="32"/>
  <text class="uc-text" x="350" y="376">Tra cứu chuyến tàu</text>

  <ellipse class="uc" cx="350" cy="440" rx="120" ry="32"/>
  <text class="uc-text" x="350" y="446">Xem ghế trống</text>

  <ellipse class="uc" cx="350" cy="510" rx="120" ry="32"/>
  <text class="uc-text" x="350" y="516">Đặt vé / Bán vé</text>

  <ellipse class="uc" cx="350" cy="580" rx="120" ry="32"/>
  <text class="uc-text" x="350" y="586">Tìm kiếm vé</text>

  <!-- Admin Use Cases -->
  <ellipse class="uc" cx="850" cy="230" rx="130" ry="32"/>
  <text class="uc-text" x="850" y="236">Xem dashboard</text>

  <ellipse class="uc" cx="850" cy="300" rx="130" ry="32"/>
  <text class="uc-text" x="850" y="306">Quản lý ga tàu</text>

  <ellipse class="uc" cx="850" cy="370" rx="130" ry="32"/>
  <text class="uc-text" x="850" y="376">Quản lý tàu</text>

  <ellipse class="uc" cx="850" cy="440" rx="130" ry="32"/>
  <text class="uc-text" x="850" y="446">Quản lý toa &amp; loại ghế</text>

  <ellipse class="uc" cx="850" cy="510" rx="130" ry="32"/>
  <text class="uc-text" x="850" y="516">Quản lý lịch trình</text>

  <ellipse class="uc" cx="850" cy="580" rx="130" ry="32"/>
  <text class="uc-text" x="850" y="586">Quản lý tài khoản</text>

  <!-- Support Use Cases -->
  <ellipse class="uc" cx="600" cy="640" rx="140" ry="32"/>
  <text class="uc-text" x="600" y="646">Cập nhật hành khách</text>

  <ellipse class="uc" cx="600" cy="710" rx="120" ry="32"/>
  <text class="uc-text" x="600" y="716">Hủy vé</text>

  <ellipse class="uc" cx="600" cy="780" rx="140" ry="32"/>
  <text class="uc-text" x="600" y="786">In / xuất thông tin vé</text>

  <!-- Associations - Staff -->
  <line class="assoc" x1="120" y1="230" x2="230" y2="230"/>
  <line class="assoc" x1="120" y1="300" x2="230" y2="300"/>
  <line class="assoc" x1="120" y1="350" x2="230" y2="370"/>
  <line class="assoc" x1="120" y1="400" x2="230" y2="440"/>
  <line class="assoc" x1="120" y1="450" x2="230" y2="510"/>
  <line class="assoc" x1="120" y1="500" x2="230" y2="580"/>

  <!-- Associations - Admin -->
  <line class="assoc" x1="1080" y1="230" x2="980" y2="230"/>
  <line class="assoc" x1="1080" y1="300" x2="980" y2="300"/>
  <line class="assoc" x1="1080" y1="350" x2="980" y2="370"/>
  <line class="assoc" x1="1080" y1="400" x2="980" y2="440"/>
  <line class="assoc" x1="1080" y1="450" x2="980" y2="510"/>
  <line class="assoc" x1="1080" y1="500" x2="980" y2="580"/>

  <!-- Relationships -->
  <path class="include" d="M470 510 Q 550 510 600 608"/>
  <text class="label" x="510" y="530">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M470 580 Q 550 580 500 750 L 530 760"/> <!-- In vé -->
  <text class="label" x="480" y="720" transform="rotate(-70 480 720)">&lt;&lt;include&gt;&gt;</text>

  <path class="extend" d="M500 700 Q 420 700 370 612"/> <!-- Hủy vé to Tìm kiếm -->
  <text class="label" x="440" y="690">&lt;&lt;extend&gt;&gt;</text>

</svg>
